[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fitbasket"
version = "0.1.0"
description = "An AI personal trainer and grocery agent: meal plans, deal-aware weekly shop, workouts and how-to videos."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
azure = ["openai>=1.40"]
all = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
fitbasket = "fitbasket.cli:main"
fitbasket-mcp = "fitbasket.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fitbasket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
